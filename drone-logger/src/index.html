<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitDrone</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f1720">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply a forced theme before first paint (see ThemeService). "system" leaves it to prefers-color-scheme.
    try { var t = localStorage.getItem('gitdrone-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
